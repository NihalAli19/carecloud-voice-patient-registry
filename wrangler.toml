name = "carecloud-voice-patient-registry"
main = "src/index.ts"
compatibility_date = "2026-10-10"
workers_dev = true

[observability.logs]
enabled = true
invocation_logs = true

[[d1_databases]]
binding = "DB"
database_name = "carecloud-patient-registry"
database_id = "REPLACE_AFTER_RUNNING_WRANGLER_D1_CREATE"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "development"
ALLOWED_ORIGIN = ""
